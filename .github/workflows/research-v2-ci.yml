name: Research V2 CI

on:
  push:
    branches:
      - admissions-research-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository without third-party actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Show Python version
        run: python3 --version

      - name: Compile research code
        run: python3 -m compileall -q research_v2 tests

      - name: Validate frozen research design
        run: python3 -m research_v2.validate_design

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test_research_v2.py" -v
