name: Research V2 CI

on:
  push:
    branches:
      - admissions-research-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile research code
        run: python -m compileall -q research_v2 tests

      - name: Validate frozen research design
        run: python -m research_v2.validate_design

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_research_v2.py" -v
